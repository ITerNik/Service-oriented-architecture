apiVersion: apps/v1
kind: Deployment
metadata:
  name: web2
  namespace: soa
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web2
  template:
    metadata:
      labels:
        app: web2
    spec:
      containers:
        - name: web2
          image: web2:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: COLLECTION_MANAGING_SERVICE_URL
              value: "https://haproxy1:8443"
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 10