  apiVersion: keda.sh/v1alpha1
  kind: ScaledObject
  metadata:
    name: web1-scaler
    namespace: soa
  spec:
    scaleTargetRef:
      apiVersion: apps/v1
      kind: Deployment
      name: web1
    minReplicaCount: 2
    maxReplicaCount: 6
    pollingInterval: 30              # ⬆️ Реже проверяем (каждые 30 сек)
    cooldownPeriod: 300               # ⬆️ 5 минут перед scale down

    # ВАЖНО: Настройка поведения масштабирования
    advanced:
      horizontalPodAutoscalerConfig:
        behavior:
          scaleUp:
            stabilizationWindowSeconds: 60    # Ждем 60 сек перед scale up
            policies:
              - type: Pods
                value: 1                         # Добавлять по 1 поду за раз
                periodSeconds: 60                # Каждые 60 секунд
              - type: Percent
                value: 50                        # Или увеличивать на 50%
                periodSeconds: 60
            selectPolicy: Min                  # Выбираем минимальное значение
          scaleDown:
            stabilizationWindowSeconds: 300   # Ждем 5 минут перед scale down
            policies:
              - type: Pods
                value: 1                         # Убирать по 1 поду за раз
                periodSeconds: 60
            selectPolicy: Min

    triggers:
      - type: memory
        metricType: Utilization
        metadata:
          value: "80"                          # При 80% memory начать масштабирование
      - type: cpu
        metricType: Utilization
        metadata:
          value: "70"                          # При 70% CPU начать масштабирование